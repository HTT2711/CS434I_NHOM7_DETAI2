name: CI Pipeline - Tasty House POS

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  backend-test:
    name: Backend - Jest Unit & API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/tasty_house_test"

      - name: Run Jest Tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: "ci_test_secret_key_cs434"
          DATABASE_URL: "mysql://root:root@localhost:3306/tasty_house_test"

  frontend-build:
    name: Frontend - Vite React Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5000/api"
          VITE_SOCKET_URL: "http://localhost:5000"